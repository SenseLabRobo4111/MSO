schema_version: '1.0'
team_id: sensebeetle_team_4_v1
team_size: 4
collection_ready: false
claim_authorized: false
protocol_lock:
  stopping_rule_id: SET_STOPPING_RULE_ID
  motion_limits_id: SET_MOTION_LIMITS_ID
  sensing_policy_id: SET_SENSING_POLICY_ID
  planner_policy_id: SET_PLANNER_POLICY_ID
  software_commit: SET_40_HEX_GIT_COMMIT
  maximum_clock_offset_ms: 5.0
  maximum_clock_rtt_ms: 20.0
recorder:
  output_root: /data/mso_physical
  min_free_gb: 100
  max_clock_offset_ms: 5.0
  max_clock_rtt_ms: 20.0
topic_templates:
  required_global:
    - /tf
    - /tf_static
    - /merged_map
    - /mso/registration_event
    - /mso/safety_event
    - /mso/coverage_event
  required_per_robot:
    - /robot_{id}/lidar/points
    - /robot_{id}/odom
    - /robot_{id}/map
    - /robot_{id}/provisional_predicted_map
    - /robot_{id}/cmd_vel
    - /ground_truth/robot_{id}/pose
  optional_per_robot:
    - /robot_{id}/provisional_predicted_map_global
analysis:
  min_common_duration_s: 600.0
  min_sensor_messages: 100
  min_pose_messages: 100
  min_map_messages: 10
  translation_limit_m: 0.15
  yaw_limit_deg: 5.0
  recovery_deadline_s: 5.0
required_evidence:
  - evidence/overhead_video.mp4
  - evidence/site_photo.jpg
  - evidence/robot_roster.csv
  - evidence/reference_calibration.json
  - evidence/reference_extrinsics.json
robots:
  - id: 0
    namespace: /robot_0
    host: SET_HOST_0
    base_serial: SET_BASE_SERIAL_0
    lidar_serial: SET_LIDAR_SERIAL_0
    compute_serial: SET_COMPUTE_SERIAL_0
    data_interface: SET_DATA_INTERFACE_0
    safety_interface: SET_SAFETY_INTERFACE_0
  - id: 1
    namespace: /robot_1
    host: SET_HOST_1
    base_serial: SET_BASE_SERIAL_1
    lidar_serial: SET_LIDAR_SERIAL_1
    compute_serial: SET_COMPUTE_SERIAL_1
    data_interface: SET_DATA_INTERFACE_1
    safety_interface: SET_SAFETY_INTERFACE_1
  - id: 2
    namespace: /robot_2
    host: SET_HOST_2
    base_serial: SET_BASE_SERIAL_2
    lidar_serial: SET_LIDAR_SERIAL_2
    compute_serial: SET_COMPUTE_SERIAL_2
    data_interface: SET_DATA_INTERFACE_2
    safety_interface: SET_SAFETY_INTERFACE_2
  - id: 3
    namespace: /robot_3
    host: SET_HOST_3
    base_serial: SET_BASE_SERIAL_3
    lidar_serial: SET_LIDAR_SERIAL_3
    compute_serial: SET_COMPUTE_SERIAL_3
    data_interface: SET_DATA_INTERFACE_3
    safety_interface: SET_SAFETY_INTERFACE_3
