schema_version: '1.0'
campaign_id: tf27_n4_mso_304k_factorial_v1
site_id: tongfang_27f_office
arena_id: tongfang_27f_office_roi_v1
method: mso
team_size: 4
collection_ready: false
results_status: not_collected
claim_authorized: false
run_duration_s: 600
required_complete_blocks: 8
primary_endpoint:
  name: normalized_coverage_auc
  definition: integral_of_independent_measured_only_gt_coverage_divided_by_600_s
  primary_contrast: mso_304k_minus_observed_only_under_nominal_network
factors:
  predictor_mode:
    - mso_304k
    - observed_only
  network_condition:
    - nominal
    - isolated_robot_impairment
balanced_allocation:
  design: four_condition_williams_sequences_within_start_pose_block
  frozen_before_collection: true
  sequence_labels:
    A:
      predictor_mode: mso_304k
      network_condition: nominal
    B:
      predictor_mode: observed_only
      network_condition: nominal
    C:
      predictor_mode: mso_304k
      network_condition: isolated_robot_impairment
    D:
      predictor_mode: observed_only
      network_condition: isolated_robot_impairment
  allowed_williams_sequences:
    - [A, B, D, C]
    - [B, C, A, D]
    - [C, D, B, A]
    - [D, A, C, B]
  required_repetitions_per_sequence: 2
network_impairment:
  profile_id: isolate_one_robot_udp_v1
  transport: udp
  data_plane_only: true
  out_of_band_safety_required: true
  start_offset_s: 180
  phases:
    - phase_id: baseline
      start_s: 180
      end_s: 210
      loss_probability: 0.0
    - phase_id: degraded
      start_s: 210
      end_s: 255
      loss_probability: 0.2
    - phase_id: disconnected
      start_s: 255
      end_s: 275
      loss_probability: 1.0
    - phase_id: recovery_monitor
      start_s: 275
      end_s: 320
      loss_probability: 0.0
locks:
  team: config/team_4.yaml
  arena: config/arena.yaml
  start_poses: config/start_poses.yaml
  model: config/model_lock.yaml
  online_stack: config/online_stack_lock.yaml
  network: config/network_lock.yaml
  pilot_plan: config/pilot_plan.yaml
  reference: config/reference.yaml
