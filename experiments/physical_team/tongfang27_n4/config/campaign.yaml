  - {order: 2, run_id: tf27_n4_b01_C, block_id: 1, trial_id: 1, sequence_position: 2, treatment_label: C, predictor_mode: mso_304k, network_condition: isolated_robot_impairment, start_pose_set_id: P01, hardware_pose_assignment: [0, 1, 2, 3], isolated_robot_id: 0, duration_s: 600}
